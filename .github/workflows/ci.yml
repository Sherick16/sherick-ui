name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Regenerate dependency lock
        run: bun install --ignore-scripts
      - name: Apply one-time Phase 3 canonicalization
        run: |
          node scripts/phase3-source-codemod.mjs
          node scripts/phase3-docs-codemod.mjs
          node scripts/phase3-ownership-codemod.mjs
          node scripts/phase3-review-codemod.mjs
      - name: Generate reviewed deterministic style baseline
        run: |
          bun --filter sherick-ui build
          bun --filter sherick-ui visual --update
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Verify hard cutover
        run: bun run verify
      - name: Capture browser diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-browser-diffs
          path: |
            apps/showcase/test-results
            apps/no-tailwind/test-results
          if-no-files-found: ignore
      - name: Commit deterministic migration output
        run: |
          git add bun.lock docs/DESIGN_LANGUAGE.md packages/ui/src/components apps/showcase/app/page.tsx packages/ui/scripts/visual-baselines/visual-regression.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze Phase 3 generated source"
          git push origin HEAD:${{ github.head_ref }}
