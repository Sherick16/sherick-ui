name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply Phase 3 source cleanup
        run: node scripts/phase3-source-codemod.mjs
      - name: Regenerate dependency lock
        run: bun install
      - name: Generate reviewed deterministic style baseline
        run: |
          bun --filter sherick-ui build
          bun --filter sherick-ui visual --update
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Verify hard cutover
        run: bun run verify
      - name: Commit deterministic migration output
        run: |
          git add bun.lock packages/ui/src/components/ui.common.ts packages/ui/scripts/visual-baselines/visual-regression.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Phase 3 styling artifacts"
          git push origin HEAD:${{ github.head_ref }}
