name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      # Bun installs and runs the scripts; Node supplies the runtime that the tool
      # binaries (next, rollup, tsc) launch through their shebangs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Verify migration before accepting generated state
        run: bun run lint && bun run typecheck && bun run build && bun run next:build && bun run test
      - name: Regenerate deterministic visual baseline
        run: bun scripts/visual-regression.mjs --update
      - name: Commit generated migration state
        run: |
          git add bun.lock scripts/visual-baselines/visual-regression.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Base UI lockfile and visual baseline"
          git push origin HEAD:${{ github.head_ref }}
