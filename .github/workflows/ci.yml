name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main release while a later push is queued.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Install the browsers of the Playwright the lockfile pins. The workspace root has no
      # `playwright` bin, so a bare `bunx playwright` downloads whatever npm calls latest and
      # installs a Chromium build the pinned test runner cannot find.
      - run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: apps/showcase
      # Every task of `bun run verify` but the browser suites, which have their own jobs; the
      # runner starts each task as soon as the tasks it reads from have passed.
      - name: Verify package and types
        run: node scripts/verify.mjs --skip=browser:showcase,browser:no-tailwind,build:no-tailwind

  browser-showcase:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Playwright splits the suite's tests between the jobs.
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Install the browsers of the Playwright the lockfile pins. The workspace root has no
      # `playwright` bin, so a bare `bunx playwright` downloads whatever npm calls latest and
      # installs a Chromium build the pinned test runner cannot find.
      # WebKit is installed for the one `@webkit` axe scan; the chromium and touch projects need only Chromium.
      - run: ./node_modules/.bin/playwright install --with-deps chromium webkit
        working-directory: apps/showcase
      # Builds the package and the showcase, then runs this job's share of the suite.
      - run: node scripts/verify.mjs browser:showcase --shard=${{ matrix.shard }}
      - name: Capture browser diff artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: showcase-browser-diffs-${{ strategy.job-index }}
          path: apps/showcase/test-results
          if-no-files-found: ignore

  browser-consumer:
    runs-on: ubuntu-latest
    # Keep this version aligned with @playwright/test in bun.lock.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The Playwright image has no unzip; install Bun without setup-bun's zip extraction.
      - run: npm install --global bun@1.3.14
      - run: bun install --frozen-lockfile
      # Builds the package and the consumer app, then runs its browser suite.
      - run: node scripts/verify.mjs browser:no-tailwind
        env:
          # GitHub's mounted /github/home is not owned by the container's root user.
          HOME: /root
      - name: Capture browser diff artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-browser-diffs
          path: apps/no-tailwind/test-results
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser-showcase, browser-consumer]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check npm version
        id: release
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          latest=$(npm view sherick-ui version)
          if [ "$version" = "$latest" ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e '
            const [next, current] = process.argv.slice(1).map(version => {
              if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error(`Expected stable semver: ${version}`);
              return version.split(".").map(Number);
            });
            for (let i = 0; i < 3; i++) {
              if (next[i] > current[i]) process.exit(0);
              if (next[i] < current[i]) throw new Error("Package version must exceed npm latest");
            }
            throw new Error("Package version must exceed npm latest");
          ' "$version" "$latest"
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Use npm with staged publishing support
        if: steps.release.outputs.publish == 'true'
        run: npm install --global npm@^11.15.0
      - uses: oven-sh/setup-bun@v2
        if: steps.release.outputs.publish == 'true'
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - name: Stage on npm
        if: steps.release.outputs.publish == 'true'
        working-directory: packages/ui
        run: npm stage publish --access public --provenance
