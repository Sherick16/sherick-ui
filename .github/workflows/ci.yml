name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main release while a later push is queued.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Verify package and types
        run: |
          bun run lint
          bun run test:motion
          bun --filter sherick-ui typecheck
          bun --filter sherick-ui build
          bun --filter @sherick-ui/showcase typecheck
          bun --filter @sherick-ui/no-tailwind typecheck
          bun run test
          bun run test:bundle
          bun run test:packed
          bun run visual

  browser-showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun --filter sherick-ui build
      - run: bun --filter @sherick-ui/showcase build
      - run: bunx playwright install --with-deps chromium
      - run: bun --filter @sherick-ui/showcase test:browser
      - name: Capture browser diff artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: showcase-browser-diffs
          path: apps/showcase/test-results
          if-no-files-found: ignore

  browser-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun --filter sherick-ui build
      - run: bun --filter @sherick-ui/no-tailwind build
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun --filter @sherick-ui/no-tailwind test:browser
      - name: Capture browser diff artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-browser-diffs
          path: apps/no-tailwind/test-results
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser-showcase, browser-consumer]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check npm version
        id: release
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          latest=$(npm view sherick-ui version)
          if [ "$version" = "$latest" ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e '
            const [next, current] = process.argv.slice(1).map(version => {
              if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error(`Expected stable semver: ${version}`);
              return version.split(".").map(Number);
            });
            for (let i = 0; i < 3; i++) {
              if (next[i] > current[i]) process.exit(0);
              if (next[i] < current[i]) throw new Error("Package version must exceed npm latest");
            }
            throw new Error("Package version must exceed npm latest");
          ' "$version" "$latest"
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Use npm with staged publishing support
        if: steps.release.outputs.publish == 'true'
        run: npm install --global npm@^11.15.0
      - uses: oven-sh/setup-bun@v2
        if: steps.release.outputs.publish == 'true'
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - name: Stage on npm
        if: steps.release.outputs.publish == 'true'
        working-directory: packages/ui
        run: npm stage publish --access public --provenance
